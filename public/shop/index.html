<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening KliqHub Shop...</title>
    <!-- AUTOMATIC REDIRECT TIMER: 3 seconds to your store -->
    <meta http-equiv="refresh" content="3;url=https://etsy.com">
    
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #0b0f19; /* Your brand dark theme */
            font-family: sans-serif;
            overflow: hidden;
        }
        .container {
            text-align: center;
        }
        .logo {
            max-width: 240px;
            height: auto;
            margin-bottom: 30px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        .text {
            font-size: 24px;
            color: #ffffff;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 0 10px #00d2ff, 0 0 20px #00a8ff;
        }
        .fallback {
            margin-top: 30px;
            display: inline-block;
            color: #00a8ff;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Pulls the image directly from your public folder asset -->
        <img src="../KH merch.png" alt="KliqHub Logo" class="logo">
        <div class="text">Taking you to our shop...</div>
        <a href="https://etsy.com" class="fallback">Click here if you aren't redirected</a>
    </div>

</body>
</html>
